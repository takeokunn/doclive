name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly run: revalidate against upstream Emacs/nixpkgs and, via the
    # cdn-assets job below, confirm the pinned browser assets still resolve.
    - cron: '17 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Run release gate
        run: nix develop --command make check

      - name: Validate flake outputs
        run: nix flake check --no-build

  emacs-compat:
    name: emacs-compat (${{ matrix.emacs-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          # Minimum supported version declared in Package-Requires.
          - '29.1'
          # Latest stable release.
          - '30.2'
        include:
          - emacs-version: snapshot
            experimental: true

    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Emacs ${{ matrix.emacs-version }}
        uses: purcell/setup-emacs@1f1e9c315c2e3312705e920ae1ddd7e0e2b13c69
        with:
          version: ${{ matrix.emacs-version }}

      - name: Byte-compile, test, and lint
        run: |
          make compile
          make test
          make lint

  macos-compat:
    name: macos-compat (${{ matrix.emacs-version }})
    runs-on: macos-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          - '29.1'
          - '30.2'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Emacs ${{ matrix.emacs-version }}
        uses: jcs090218/setup-emacs@54b61ac9c1d7011a54d2b6d66dedbcddf20e2fb9
        with:
          version: ${{ matrix.emacs-version }}

      - name: Byte-compile, test, and lint
        run: |
          make compile
          make test
          make lint

  cdn-assets:
    # Scheduled-only: fetch the pinned browser assets so a moved or deleted
    # CDN pin fails loudly instead of silently breaking the preview.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Verify pinned CDN assets resolve
        run: nix develop --command make check-assets
